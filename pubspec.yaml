name: edu_advisor
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  cherry_toast: ^1.13.0
  device_preview: ^1.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.2.1
  dio: ^5.9.2
  flutter_secure_storage: ^10.3.1
  dartz: ^0.10.1
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  go_router: ^17.2.3
  intl: any
  shared_preferences: ^2.5.4
  shimmer: ^3.0.0
  get_it: ^9.2.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/edu_advisor_logo_source.png
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/edu_advisor_logo_transparent.png
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/branding/edu_advisor_logo_transparent.png
  android: true
  ios: true
  web: false
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: "#FFFFFF"
    image: assets/branding/edu_advisor_logo_transparent.png

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
